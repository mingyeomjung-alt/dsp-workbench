name: Experimental prototype checks

# Intentionally no push, pull_request, release, schedule, Pages or package publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node and frozen DSP smoke checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out only this reviewed repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Inspect static bundle and loopback runner
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install numerical runtime only
        run: python -m pip install "numpy==2.2.5" "scipy==1.14.1"
      - name: Run unchanged engine on owned examples
        run: python scripts/check_engine.py
