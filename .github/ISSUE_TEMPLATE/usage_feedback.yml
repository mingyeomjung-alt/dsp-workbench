name: Workflow feedback
description: Explain the processing problem and whether the diagnostic helped.
title: "[Feedback] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This issue and its attachments are public. We are testing usefulness in real audio-processing workflows, not offering automatic quality approval. Please do not post private audio, customer names, confidential code, credentials, private filenames, file hashes, or unreviewed reports. You do not need to identify yourself or your employer.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed private information, private filenames, hashes, and audio.
          required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem
      description: What processing do you do, and how do you currently find missing or repeated audio? A brief description is enough.
    validations:
      required: true
  - type: dropdown
    id: tried
    attributes:
      label: Trial status
      options:
        - Have not tried it yet
        - Included synthetic example only
        - My own supported processing pair
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: What helped or did not
      description: Did a location, playback, warning, or withheld result help? Did it shorten investigation, miss a known issue, or add unnecessary review? Approximate observations are welcome; no measurements are required.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Would you use it again? (optional)
      description: What would make it useful in your next code change? This is feedback, not a purchase commitment or a request to publish data.
    validations:
      required: false
