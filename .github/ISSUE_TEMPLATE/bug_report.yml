name: Bug report
description: Report a reproducible problem without attaching private audio.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This issue and its attachments are public. Please do not attach customer audio, recordings of people, credentials, private filenames, file hashes, or unreviewed reports. Use a minimal synthetic reproduction if possible. For sensitive security findings, follow SECURITY.md instead. This tool does not provide full audio-quality or release approval.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed private information, private filenames, hashes, and audio.
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, package version, pair or suite, selected engine, and actual gain/resampling declarations. Do not include account or device identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the processing steps and clicks. For a safe synthetic example, explain how it can be generated. Include input sample rate, channels, duration, and PCM format.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed
      description: Include the visible status or error code. A withheld/inconclusive result is not itself proof of a software bug; explain why the supported case should be measurable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence (optional)
      description: A short text excerpt or redacted screenshot only. Remove file hashes, private filenames, and identifying diagnostic details before sharing. Do not attach full exported reports.
    validations:
      required: false
