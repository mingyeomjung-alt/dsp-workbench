name: Bug report / 오류 보고
description: Report a reproducible problem without attaching private audio.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach customer audio, recordings of people, credentials, private filenames, file hashes, or unreviewed reports. Use a minimal synthetic reproduction if possible. This tool does not provide full audio-quality or release approval.
        고객 오디오·사람의 녹음·인증정보·비공개 파일명·파일 해시·확인하지 않은 보고서를 첨부하지 마세요. 가능하면 최소 합성 예제를 사용하세요.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 개인정보 확인
      options:
        - label: I have removed private information, private filenames, hashes, and audio. / 개인정보·비공개 파일명·해시·오디오를 포함하지 않았습니다.
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 실행 환경
      description: Browser and version, OS, package version, pair or suite, selected engine, and actual gain/resampling declarations. Do not include account or device identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 재현 순서
      description: List the processing steps and clicks. For a safe synthetic example, explain how it can be generated. Include input sample rate, channels, duration, and PCM format.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed / 기대 결과와 실제 결과
      description: Include the visible status or error code. A withheld/inconclusive result is not itself proof of a software bug; explain why the supported case should be measurable.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 개인정보를 제거한 근거 (optional)
      description: A short text excerpt or redacted screenshot only. Remove file hashes, private filenames, and identifying diagnostic details before sharing. Do not attach full exported reports.
    validations:
      required: false
